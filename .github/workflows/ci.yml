name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: lint, test, package
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      # The README tells users to run scripts/run_eval.sh and friends directly, so the executable
      # bit is part of the interface: without it a Linux/macOS checkout fails with exit 126 and no
      # useful message. The first CI run failed exactly this way on test_count.sh.
      - name: Check the scripts are executable
        run: |
          status=0
          for script in scripts/*.sh; do
            if [[ ! -x "$script" ]]; then
              echo "::error file=$script::$script is not executable — git update-index --chmod=+x $script"
              status=1
            fi
          done
          exit "$status"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Formatting (Spotless)
        run: ./gradlew spotlessCheck

      - name: Static analysis (Checkstyle)
        run: ./gradlew checkstyleMain checkstyleTest

      - name: Test
        run: ./gradlew test

      - name: Test count (generated, STANDARDS §3)
        run: scripts/test_count.sh --no-run

      - name: Package
        run: ./gradlew assemble

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests/test
          if-no-files-found: ignore

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
